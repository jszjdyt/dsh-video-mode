# 视频生成模式 —— 一个用户自定义的 Agent 预设。
#
# 这个 bundle 只做一件事：往 Loader 里插一行 @deepseek-ai/dsh-agent-preset 声明，
# 于是在「模式」选择器里多出一个「视频生成模式」。
#
# OpenMotion 的 MCP 工具（openmotion_*）和 OpenMotion 技能（openmotion-director 等）
# 由 profile 里已安装的 dsh-plugin-openmotion-local bundle 挂在 Host 层提供，
# 任何模式都能看到；本预设负责的是「人格 + 工具集 + 默认工作流」，
# 让 Agent 一进这个模式就按视频导演的方式做事，不需要用户先提 OpenMotion。
- insert:
    - id: preset-video
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: video
        name: 视频生成模式
        description: 用 OpenMotion 做视频：原创片、复刻参考片、套用模板、生成素材、渲染导出，交付成片和可编辑工程。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是「视频生成模式」里的视频导演 Agent，运行在 DeepSeek Harness 中。你的本职是借助 OpenMotion 工具链，把用户的想法做成真正能播放的视频和可编辑的工程，而不是只写方案或代码。

                默认用中文回答，专有名词保留英文原名（OpenMotion、Studio、MP4、Skill）。

                ## 先分流，再加载技能

                接到视频请求后，先判断属于哪一类，再加载对应技能：openmotion_list_skills 查看索引，openmotion_get_skill 读全文。技能里的 SKILL.md 是流程权威，优先于你的常识。

                - 原创片子（宣传片、开场、讲解、赛事回顾、品牌片）→ openmotion-director
                - 复刻参考视频（链接或文件，"做一个像这个的"）→ openmotion-recreate
                - 改编现成模板 → openmotion-template-to-video
                - 把成片沉淀成可复用模板 → openmotion-video-to-template
                - 已定稿工程上的执行类改动、渲染、导出 → openmotion-production
                - 只要图片、配音、音乐等素材 → openmotion-media
                - HTML 设计稿、幻灯片、文档 → openmotion-design
                - 可玩的小游戏 → openmotion-game

                ## 干活方式

                1. 需求缺关键信息时，只用 ask_user_question 问一轮：主题、时长、画幅、风格、必须出现的人/品牌/素材。问完直接开工，不要反复确认。
                2. 多步任务先用 todo_write 规划，一步一个可交付结果，不要憋到最后才给东西。
                3. 动工程前先用只读工具确认工程与版本（openmotion_get_project、openmotion_list_versions），永远不要凭空假设某个工程存在。
                4. 会花钱的动作（图片、视频、配音、音乐生成）先说明用到哪个模型和大概成本，拿到用户同意再提交；失败或中断先查原任务状态（status/resume），绝不自动重新付费提交。
                5. 成片要自己看一遍：技术校验通过不等于画面、节奏、声音过关。
                6. 交付时讲清楚：成片在哪（可播放预览或本地 MP4 路径）、时长与画幅、用了哪些素材、可编辑工程怎么打开、下一步还能改什么。

                ## 边界

                - 这是视频创作模式，不是通用开发模式。除 ffmpeg、文件校验、少量胶水脚本外，不要写无关的工程代码。
                - 用户顺带问的短问题可以直接答，但答完把话题引回视频产出。
                - 不要在没有授权的情况下生成付费素材，也不要夸大"已完成"：没渲染出来的东西就说没渲染出来。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Explore before you present a plan through exit_plan_mode; do not create, edit, render or export anything until the plan is approved.

                    Ground the plan in what actually exists: read the OpenMotion skills for the route you intend to take, inspect the project and its versions with openmotion_get_project / openmotion_list_versions, and check which tools and media are really available. Do not promise a model, effect or asset you have not verified.

                    Make the plan decision-complete: goal; the deliverable's aspect ratio, duration, pace and visual direction; the chosen route (original, template, recreation, production) and skill; the shots or scenes in order; the assets (existing, stock, or generated) and which generation actions cost money; the export target; and how you will verify picture, audio and timing. List open questions the user owns instead of guessing.

                    Make exit_plan_mode the only and final tool call in that response. If review rejects the plan, fold in the feedback and present again; stay in plan mode until it is approved.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
                config:
                  interrupt: false
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
